name: qatorah_app
description: تطبيق قطوره - منصة الخدمات المائية والصيانة المتكاملة
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  provider: ^6.1.2
  shared_preferences: ^2.5.6

  image_picker: ^1.2.4
  speech_to_text: ^7.5.0
  permission_handler: ^11.3.1

  intl: ^0.20.0
  timezone: ^0.9.4
  math_expressions: ^2.6.0
  weather: ^3.1.1
  flutter_local_notifications: ^17.2.3
  http: ^1.2.2
  
  # ✅ تم التحديث من 0.4.3 إلى 0.4.6 (يدعم v1beta بشكل صحيح)
  google_generative_ai: ^0.4.6 
  
  mobile_scanner: ^5.2.3 
  qr_flutter: ^4.1.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  pinput: ^7.0.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_foreground_inset: 0

flutter_native_splash:
  color: "#0A0E1A"
  image: "assets/images/splash.png"
  android: true
  ios: true
  fullscreen: true
  android_gravity: "fill"
  android_12:
    image: "assets/images/splash.png"
    icon_background_color: "#0A0E1A"
    fullscreen: true